name: Project quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TEST_THREADS: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            agentterm-tui -> target

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all project quality checks
        run: pnpm check

  windows-frontend:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend on Windows
        run: pnpm test

      - name: Typecheck and build frontend on Windows
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test native persistence and recovery on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload frontend for interaction acceptance
        uses: actions/upload-artifact@v4
        with:
          name: frontend-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
