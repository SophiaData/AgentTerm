name: Build packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        options: [all, windows, macos]
        default: all
      include_tui:
        description: Build the TUI after desktop packages
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_TEST_THREADS: '1'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        # pnpm/action-setup v4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.24.0
          run_install: false

      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: pnpm

      # dtolnay/rust-toolchain stable branch commit; toolchain is fixed separately
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        # tauri-apps/tauri-action v1
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        with:
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin --bundles dmg' || '--bundles nsis' }}
          uploadWorkflowArtifacts: true

      - name: Package Windows desktop npm artifact
        if: runner.os == 'Windows'
        run: node scripts/package-npm.mjs src-tauri/target/release/agentterm.exe dist-npm

      - name: Upload npm desktop package
        if: runner.os == 'Windows'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentterm-npm-windows-x64
          path: dist-npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  tui:
    if: ${{ inputs.include_tui }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # dtolnay/rust-toolchain stable branch commit; toolchain is fixed separately
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.90.0

      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: agentterm-tui -> target

      - name: Build tiny TUI binary
        run: cargo build --release --manifest-path agentterm-tui/Cargo.toml

      - name: Upload TUI binary
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform == 'macos-latest' && 'agentterm-macos-arm64' || 'agentterm-windows-x64' }}
          path: agentterm-tui/target/release/${{ matrix.platform == 'macos-latest' && 'agentterm' || 'agentterm.exe' }}
          if-no-files-found: error
