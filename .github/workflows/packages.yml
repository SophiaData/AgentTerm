name: Build packages

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  tui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: agentterm-macos-arm64
            binary: agentterm
          - platform: windows-latest
            artifact: agentterm-windows-x64
            binary: agentterm.exe
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build tiny TUI binary
        run: cargo build --release --manifest-path agentterm-tui/Cargo.toml

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: agentterm-tui/target/release/${{ matrix.binary }}
          if-no-files-found: error
