name: Build packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        options: [all, windows, macos]
        default: all
      include_tui:
        description: Build the TUI after desktop packages
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_TEST_THREADS: '1'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin --bundles dmg' || '--bundles nsis' }}
          uploadWorkflowArtifacts: true

  tui:
    if: ${{ inputs.include_tui }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentterm-tui -> target

      - name: Build tiny TUI binary
        run: cargo build --release --manifest-path agentterm-tui/Cargo.toml

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform == 'macos-latest' && 'agentterm-macos-arm64' || 'agentterm-windows-x64' }}
          path: agentterm-tui/target/release/${{ matrix.platform == 'macos-latest' && 'agentterm' || 'agentterm.exe' }}
          if-no-files-found: error
