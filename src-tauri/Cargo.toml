[package]
name = "agentterm"
version = "0.2.0-rc.14"
description = "A focused desktop manager for AI command-line tools"
edition = "2024"
rust-version = "1.90"

[lib]
name = "agentterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
getrandom = "0.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-single-instance = "2"
portable-pty = "0.9.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
anyhow = "1"
chrono-tz = "0.10"
libc = "0.2"
