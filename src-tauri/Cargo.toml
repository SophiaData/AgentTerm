[package]
name = "agentterm"
version = "0.1.0"
description = "A focused desktop manager for AI command-line tools"
edition = "2024"
rust-version = "1.85"

[lib]
name = "agentterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
