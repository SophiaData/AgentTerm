[package]
name = "agentterm"
version = "0.2.0-rc.1"
description = "A focused desktop manager for AI command-line tools"
edition = "2024"
rust-version = "1.90"

[lib]
name = "agentterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.4"
portable-pty = "0.9.0"
