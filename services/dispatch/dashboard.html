<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgentTerm · DSH 协调</title>
    <style>
      body {
        font: 16px/1.6 system-ui;
        background: #10141d;
        color: #e8edf4;
        max-width: 960px;
        margin: 40px auto;
        padding: 0 24px;
      }
      article {
        background: #1b2230;
        border: 1px solid #344156;
        border-radius: 12px;
        padding: 24px;
        margin: 20px 0;
      }
      button {
        background: #c8e6bd;
        color: #152015;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        margin-right: 12px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
      }
      small {
        color: #a5b6cc;
      }
      #error {
        color: #ffc1b8;
      }
      h1 {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h1>DSH 协调</h1>
    <p>确认任务建议后开工。执行结果通过测试后，仍由你验收。</p>
    <button id="refresh">刷新任务</button>
    <p id="error" role="alert"></p>
    <main id="tasks" aria-live="polite"></main>
    <script src="/dashboard.js"></script>
  </body>
</html>
