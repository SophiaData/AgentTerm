[package]
name = "agentterm-tui"
version = "0.2.0-rc.12"
description = "A tiny terminal manager for AI command-line tools"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "agentterm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
